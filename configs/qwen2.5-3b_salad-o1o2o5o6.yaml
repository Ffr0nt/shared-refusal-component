model: Qwen/Qwen2.5-3B-Instruct
model_revision: aa8e72537993ba99e69dfaafa59ed015b17504d1    # коммит на HF; этап 1 сверяет его с кэшем

# Источник harmful: HF-датасет и его колонки (см. src/shared_refusal/data.py)
dataset:
  name: salad                       # метка source в файлах сплитов
  hf_path: OpenSafetyLab/Salad-Data
  hf_config: base_set
  hf_revision: d21a325e276a99bd69b1fbb8aa51a9f249486b72
  text_col: question
  domain_col: 1-category
  stratum_col: 3-category           # лист таксономии; null — без стратификации

# Домены: код -> значение domain_col
domains:
  O1: "O1: Representation & Toxicity"
  O2: "O2: Misinformation Harms"
  O5: "O5: Malicious Use"
  O6: "O6: Human Autonomy & Integrity"

# Непересекающиеся train/val/test одного размера во всех доменах (потолок — O6, 1717 строк).
# Harmless — общий для всех доменов срез Alpaca из форка geometry-of-refusal.
splits:
  n_train: 900
  n_val: 128
  n_test: 128
  seed: 0
  harmless_src: data/saladbench_splits/harmless_train.json   # относительно форка

# Одна точка (pos, layer) на все домены: select_direction на объединённом val (этап 1)
# по DIM объединённой выборки (среднее DIM доменов). Пишется в manifest.json.

# Этап 1, RDO: одномерные конусы, 20 разных сидов. Гиперпараметры rdo.py — все явно
# (сейчас совпадают с его значениями по умолчанию, на которых посчитан прогон 12.10).
rdo:
  seeds:
    O1: [1, 2, 3, 4, 5]
    O2: [6, 7, 8, 9, 10]
    O5: [11, 12, 13, 14, 15]
    O6: [16, 17, 18, 19, 20]
  hparams:
    dtype: bfloat16
    epochs: 1
    lr: 0.01
    batch_size: 1
    effective_batch_size: 16
    patience: 5
    n_lr_reduce: 2
    n_sample: 8
    fixed_samples: 8
    sampling_method: hypersphere
    ablation_lambda: 1
    addition_lambda: 0.2
    retain_lambda: 1
    target_generation_batch_size: 512
    filter_data: true
    filter_batch_size: 32

# Этап 2: общая компонента — первый собственный вектор P = (1/N) sum v v^T по направлениям
# варианта. Вариант — отбор из набора этапа 1: methods / domains / exclude (по именам).
component:
  n_null: 1000
  null_seed: 0
  variants:
    all: {}                         # все DIM и RDO, равные веса
    dim_only: {methods: [dim]}
    rdo_only: {methods: [rdo]}

# Этап 3: аблация. Проверяются компоненты перечисленных вариантов (w:<вариант>), при base —
# все направления этапа 1, и n_rand случайных. Прокси-ASR (refusal_score < 0) на harmful_test,
# KL на harmless_test.
ablation:
  components: [all]
  base: true
  n_rand: 3
  rand_seed: 0
  alphas: [0.25, 0.5, 0.75, 1.0]
  batch_size: 16

# Этап 5: сходимость общей компоненты по числу векторов (DIM и RDO без различия). Для
# N = 1 … n_max — не больше n_samples комбинаций (где меньше — все); основная метрика —
# split-half (N ≤ пул/2), подгонка 1/ρ² − 1 = k/N (+ b); targets — целевые ρ².
convergence:
  selection: {}                     # отбор из набора этапа 1, как в component.variants
  n_max: 20
  n_samples: 1000
  n_orders: 1000                    # случайные порядки для сдвига от ещё одного вектора
  seed: 21
  targets: [0.9, 0.95, 0.99]
