[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-refusal-component"
version = "0.1.0"
description = "A shared refusal component across DIM and RDO directions for SALAD-Bench harm domains."
requires-python = ">=3.10,<3.11"
dependencies = [
    "geometry-of-refusal",
    "datasets>=3.0",
    "openai>=1.40",             # клиент OpenRouter для судьи StrongREJECT (этап 07)
    "pandas",
    "pyyaml",
]

# На время разработки — editable из соседнего репозитория (локально disser/, на сервере
# ~/f.zakharov/). Перед публикацией заменить на git-зависимость с зафиксированным коммитом.
[tool.uv.sources]
geometry-of-refusal = { path = "../geometry-of-refusal", editable = true }

# Переиспользуемые модули — пакет shared_refusal в src/ (ставится editable при uv sync);
# scripts/ — шаги пайплайна поверх него.
[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Linux — сервер (GPU), macOS arm64 — локальные CPU-проверки.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
